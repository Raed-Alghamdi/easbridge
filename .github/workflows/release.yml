name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  tag:
    name: The tag matches the code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version, changelog and branch
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          code="$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/version/version.go)"
          if [ "$version" != "$code" ]; then
            echo "the tag $tag says $version, internal/version/version.go says $code"; exit 1
          fi
          if ! grep -q -F "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry '## [${version}]'"; exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the tagged commit is not on main"; exit 1
          fi
          echo "tag $tag, version $code, changelog entry present, commit on main"

  check:
    name: Checks before the image is built
    needs: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: make check
      - run: make vulncheck
      - run: make compat
      - run: make e2e
        env:
          # Fail instead of skipping if Docker turns out to be unusable.
          EASBRIDGE_E2E_REQUIRED: "1"

  image:
    name: Build and push the image
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (lower case, as the registry needs)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/easbridge" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            IMAGE=${{ env.IMAGE }}
          sbom: true
          provenance: mode=max
