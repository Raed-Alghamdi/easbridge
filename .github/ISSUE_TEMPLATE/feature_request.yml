name: Feature request
description: Something EASBridge could do that it does not.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: The situation first, then the change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today, or what else did you consider?
  - type: textarea
    id: exchange
    attributes:
      label: Can you test it against a real Exchange?
      description: Which version and setup. Protocol features that no one can check against a real server are hard to accept.
